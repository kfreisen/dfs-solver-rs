name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: build site
        run: uv run --project docs mkdocs build --strict

      # Exporting executes each notebook, so a broken example fails the deploy
      # rather than publishing a page that errors for the reader.
      - name: export examples
        run: |
          uv sync --locked --all-extras --quiet
          uv run python tools/export_examples.py --out site/examples

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${ steps.deployment.outputs.page_url }
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
