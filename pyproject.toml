[project]
name = "mlb-dfs-solver"
version = "0.0.1.dev0"
description = "Fast roster optimization — randomized greedy lineup construction and lazy-greedy submodular portfolio selection, in Rust."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Freisen", email = "freise29@gmail.com" }]
keywords = ["optimization", "greedy", "submodular", "lineup", "roster", "dfs", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    # These are advertising, not enforcement — requires-python is what installers
    # honour. Every version listed is one the abi3 wheel is actually exercised on:
    # the floor and the ceiling in CI, the interior by construction (a single
    # cp311-abi3 wheel is what all four load).
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/kfreisen/mlb-dfs-solver"
Documentation = "https://kfreisen.github.io/mlb-dfs-solver/"
Source = "https://github.com/kfreisen/mlb-dfs-solver"
Changelog = "https://github.com/kfreisen/mlb-dfs-solver/blob/main/CHANGELOG.md"
Issues = "https://github.com/kfreisen/mlb-dfs-solver/issues"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Mixed layout: hand-written Python in python/mlb_dfs_solver/, the compiled kernel built
# into mlb_dfs_solver._native. Everything public goes through a typed Python wrapper —
# _native is private, and mkdocstrings cannot read a .so anyway.
python-source = "python"
module-name = "mlb_dfs_solver._native"
manifest-path = "rust/native/Cargo.toml"
# abi3 collapses the wheel matrix from (python versions x platforms) to one wheel
# per platform. Building for the floor means the wheel also runs on every later
# interpreter.
features = ["pyo3/extension-module", "pyo3/abi3-py311"]
# The sdist must carry every crate in the workspace, or building from source
# fails for anyone on a platform without a published wheel.
include = [
    { path = "rust/Cargo.toml", format = "sdist" },
    { path = "rust/core/Cargo.toml", format = "sdist" },
    { path = "rust/core/src/**/*", format = "sdist" },
    { path = "rust/native/Cargo.toml", format = "sdist" },
    { path = "rust/native/src/**/*", format = "sdist" },
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "marimo>=0.10",
    "maturin>=1.7,<2.0",
]
# The MILP baselines. These are the "before" this package is measured against and
# must never reach a user's install — PuLP alone would drag in a CBC binary.
bench = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pulp>=3.0,<4",
    "ortools>=9.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Benchmarks live outside testpaths and are named bench_*.py so a normal `pytest`
# run never picks them up; naming them here lets `pytest benchmarks/` collect them.
python_files = ["test_*.py", "bench_*.py"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
markers = ["slow: excluded from the default run"]

[tool.coverage.run]
source = ["mlb_dfs_solver"]
branch = true

[tool.coverage.report]
# Python-side only. The Rust kernel is covered separately by `cargo llvm-cov`
# with its own threshold — see rust/README.md.
fail_under = 95
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@(typing\\.)?overload",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["python"]
mypy_path = "python"
